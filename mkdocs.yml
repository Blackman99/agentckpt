site_name: agentckpt docs
site_description: Checkpoint a working tree while coding agents run, and restore any snapshot without touching your git branches or index.
site_url: https://blackman99.github.io/agentckpt/docs/
repo_url: https://github.com/Blackman99/agentckpt
repo_name: Blackman99/agentckpt
edit_uri: edit/main/docs/
copyright: MIT © 2026 Blackman99

theme:
  name: material
  custom_dir: overrides
  favicon: assets/logo.svg
  logo: assets/logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.follow

nav:
  - Overview: index.md
  - Install: install.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Command reference: reference.md
  - FAQ: faq.md
  - Blog:
    - All posts: blog/index.md
    - "Undo for coding agents, outside git": blog/agent-undo-without-touching-git.md
    - "不碰 git 的智能体撤销": blog/agent-undo-without-touching-git-zh.md
  - Home page ↗: https://blackman99.github.io/agentckpt/

extra_css:
  - stylesheets/dmg.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
